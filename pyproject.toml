[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "livingworld-core"
version = "0.1.0"
description = "LivingWorld application runtime foundation"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
livingworld-core = "livingworld.bootstrap.cli:main"

[dependency-groups]
browser-test = ["playwright>=1.63,<2"]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["services/core/src/livingworld"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/domain", "tests/persistence", "tests/application"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
