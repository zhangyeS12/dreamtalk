[package]
name = "dreamtalk-android"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "dreamtalk_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-mobile-core = { path = "../../../plugins" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
deepseek-recipe = "=0.1.0"
deepseek-recipe-encoding = "=0.1.0"
jni = "0.21"
