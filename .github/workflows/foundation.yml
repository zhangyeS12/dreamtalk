name: dreamtalk CI
# Runs automatically so every release commit has an exact-SHA result;
# scripts/check-release-ci.py blocks release builds without it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  python:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.32'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python scripts/generate-api-contracts.py --check
      - run: uv run --frozen pytest
      - run: uv build --wheel --out-dir artifacts/core
      - run: uv run --frozen python scripts/check-wheel.py
      - run: uv run --frozen python scripts/check-doc-links.py
      - run: uv run --frozen python scripts/check-release-privacy.py --ref HEAD

  web:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.32'
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: uv sync --frozen --group browser-test
      - run: npm run typecheck:core
      - run: uv run --frozen --group browser-test playwright install --with-deps chromium
      - run: npm run test:web-smoke

  desktop-windows:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.32'
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: uv sync --frozen --group packaging
      - run: npm ci
      - run: npm run build:web
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:desktop
      - run: npm run build:desktop
      - name: Check native startup and graceful exit across three fresh profiles
        run: |
          1..3 | ForEach-Object {
            npm run test:desktop-smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare the pinned semantic model required by the standalone payload
        run: uv run --frozen python scripts/prepare-semantic-model.py
      - run: npm run build:portable

  ci:
    name: CI Gate
    if: always()
    needs: [python, web, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks, tests and builds to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            console.log(`${name}: ${job.result}`);
            if (job.result !== 'success') process.exitCode = 1;
          }
          JS
