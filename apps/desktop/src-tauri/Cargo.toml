[package]
name = "livingworld-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "LivingWorld desktop runtime supervisor"

[lib]
name = "livingworld_desktop_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
