[package]
name = "dreamtalk-desktop"
version = "0.1.21"
edition = "2021"
rust-version = "1.88"
description = "dreamtalk desktop runtime supervisor"
license = "Apache-2.0"

[lib]
name = "dreamtalk_desktop_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
tokio = { version = "1", features = ["process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
keyring = "4.2"

[dev-dependencies]
tempfile = "3"
